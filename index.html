<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f1e5"><title>IELTS Vocabulary · Accommodation</title><style>:root{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:#285a49;background:#e8f1e5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:660px;margin:auto;padding:24px 18px 60px}header{text-align:center;padding:18px 0}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(27px,6vw,40px);margin:12px 0}p{line-height:1.6}.muted{color:#66877b}.panel{background:#fffdf8;border-radius:24px;padding:22px;box-shadow:0 8px 30px #2c5e4820}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.bar{height:9px;background:#e1eae0;border-radius:9px;overflow:hidden;margin:12px 0 22px}.fill{height:100%;background:#75a48b;transition:width .2s}.card{width:100%;min-height:280px;border:1px solid #d6e6d6;background:#f2f7ed;border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px;text-align:center;cursor:pointer;color:#285a49}.word{font-family:Arial,sans-serif;font-size:clamp(25px,6vw,39px);font-weight:700;overflow-wrap:anywhere}.meaning{font-size:clamp(21px,5vw,30px);font-weight:700}.phrase{margin-top:20px;font-size:18px}.hint{margin-top:22px;font-size:13px;color:#789486}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.btn{border:0;border-radius:14px;padding:15px 10px;font-size:16px;font-weight:700;cursor:pointer;background:#dceadd;color:#285a49}.btn.dark{background:#315f4d;color:white}.btn.cream{background:#f4e9d6;color:#795f38}.secondary{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}.secondary button{border:1px solid #c9dfcd;border-radius:12px;background:white;padding:11px 14px;color:#315f4d;cursor:pointer}.stats{display:flex;justify-content:space-around;gap:10px;margin:14px 0;font-size:14px;text-align:center}.stats b{display:block;font-size:23px}.footer{text-align:center;font-size:12px;color:#688b7b;margin-top:25px}.hide{display:none!important}</style></head><body><main class="wrap"><header><div class="muted">IELTS STUDY COLLECTION</div><h1>IELTS VOCABULARY</h1><div>雅思租房主题 · 20词互动学习卡</div></header><section class="panel"><div class="top"><strong id="mode">全部词汇</strong><span id="counter">1 / 20</span></div><div class="bar"><div class="fill" id="progress"></div></div><button id="card" class="card" aria-label="点击翻面"><span id="front" class="word"></span><span id="back" class="hide"><span class="meaning" id="meaning"></span><div class="phrase" id="phrase"></div></span><span class="hint" id="hint">点击卡片查看中文释义</span></button><div class="actions"><button class="btn cream" id="miss">不认识 · 加入错词</button><button class="btn dark" id="known">认识 · 下一词</button></div><div class="secondary"><button id="prev">上一词</button><button id="all">全部20词</button><button id="wrong">错词复习</button><button id="reset">重置进度</button></div><div class="stats"><div><b id="knownCount">0</b>已认识</div><div><b id="wrongCount">0</b>待复习</div><div><b id="doneCount">0</b>已学习</div></div><p class="muted" id="notice" style="text-align:center;font-size:13px">学习结果自动保存在当前浏览器。</p></section><div class="footer">Cream Green · Free IELTS Flashcards</div></main><script>
const words=[['accommodation','住宿；住处','student accommodation：学生住宿'],['rent','租金；租用','pay rent：支付房租'],['landlord','房东','contact the landlord：联系房东'],['tenant','租客；承租人','prospective tenant：潜在租客'],['deposit','押金；保证金','security deposit：租房押金'],['lease','租约；租赁合同','sign a lease：签订租约'],['furnished','配备家具的','fully furnished：家具齐全的'],['unfurnished','不带家具的','unfurnished flat：无家具公寓'],['utilities','水电燃气等费用','utility bills：水电燃气账单'],['maintenance','维护；维修','maintenance costs：维护费用'],['property','房产；物业','rental property：出租房产'],['apartment','公寓套房','studio apartment：单间公寓'],['shared accommodation','合租住宿','find shared accommodation：寻找合租房'],['neighbourhood','街区；社区','quiet neighbourhood：安静的社区'],['commute','通勤','daily commute：日常通勤'],['amenities','便利设施','local amenities：周边便利设施'],['inspection','检查','property inspection：房屋检查'],['inventory','物品清单','inventory checklist：物品核对清单'],['notice period','提前通知期','give notice：提前通知'],['affordable','负担得起的','affordable housing：可负担住房']];
const key='ielts-accommodation-20-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}}let mode='all',index=0,flipped=false;const $=id=>document.getElementById(id);const list=()=>mode==='wrong'?words.map((w,i)=>i).filter(i=>state[i]==='miss'):words.map((w,i)=>i);const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{$('notice').textContent='当前浏览器不支持进度保存，请使用普通浏览模式。'}};function render(){let ids=list();$('mode').textContent=mode==='wrong'?'错词复习':'全部词汇';$('knownCount').textContent=Object.values(state).filter(x=>x==='known').length;$('wrongCount').textContent=Object.values(state).filter(x=>x==='miss').length;$('doneCount').textContent=Object.keys(state).length;$('progress').style.width=(Object.keys(state).length/20*100)+'%';if(!ids.length){$('counter').textContent='0 / 0';$('front').textContent=mode==='wrong'?'没有待复习错词':'暂无词汇';$('back').classList.add('hide');$('hint').textContent=mode==='wrong'?'可以返回全部词汇继续学习':'';$('miss').disabled=$('known').disabled=true;return}$('miss').disabled=$('known').disabled=false;index=(index+ids.length)%ids.length;let w=words[ids[index]];$('counter').textContent=(index+1)+' / '+ids.length;$('front').textContent=w[0];$('meaning').textContent=w[1];$('phrase').textContent=w[2];$('front').classList.toggle('hide',flipped);$('back').classList.toggle('hide',!flipped);$('hint').textContent=flipped?'点击卡片返回英文':'点击卡片查看中文释义'}function next(){flipped=false;index++;render()}$('card').onclick=()=>{if(!list().length)return;flipped=!flipped;render()};$('known').onclick=()=>{let ids=list();if(!ids.length)return;let id=ids[index];state[id]='known';save();if(mode==='wrong'){index=Math.min(index,Math.max(0,list().length-1));flipped=false;render()}else next()};$('miss').onclick=()=>{let ids=list();if(!ids.length)return;state[ids[index]]='miss';save();next()};$('prev').onclick=()=>{index--;flipped=false;render()};$('all').onclick=()=>{mode='all';index=0;flipped=false;render()};$('wrong').onclick=()=>{mode='wrong';index=0;flipped=false;render()};$('reset').onclick=()=>{if(confirm('确定清除全部学习记录吗？')){state={};save();mode='all';index=0;flipped=false;render()}};render();
</script></body></html>
